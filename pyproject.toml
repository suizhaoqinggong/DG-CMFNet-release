[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dg-cmfnet"
version = "0.1.0"
description = "DG-CMFNet: Dual-granularity Cross-Modal Fusion Network for Brain Tumor Segmentation"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "tensorboard>=2.14",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "nibabel>=5.0",
    "scipy>=1.10",
    "timm>=0.9",
    "matplotlib>=3.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
nnunet = [
    "dynamic-network-architectures==0.3.1",
]
swinunetr = [
    "monai>=1.3,<2",
    "einops>=0.6",
]
umamba = [
    "dynamic-network-architectures==0.3.1",
    "causal-conv1d==1.4.0",
    "mamba-ssm==2.2.4",
]
nnmamba = [
    "causal-conv1d==1.4.0",
    "mamba-ssm==2.2.4",
]
segmamba-v2 = [
    "monai>=1.3,<2",
    "einops>=0.6",
    "causal-conv1d==1.4.0",
    "mamba-ssm==2.2.4",
]
segmamba = [
    "monai>=1.3,<2",
    "causal-conv1d==1.4.0",
    "mamba-ssm==2.2.4",
]

[project.scripts]
framework = "framework.cli.main:main"
tensorboard-compat = "framework.cli.tensorboard_compat:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["torch"]
mamba-ssm = ["torch"]

[tool.uv.extra-build-variables]
causal-conv1d = { CAUSAL_CONV1D_FORCE_BUILD = "TRUE", MAX_JOBS = "2" }
mamba-ssm = { MAMBA_FORCE_BUILD = "TRUE", MAX_JOBS = "2" }

# These CUDA packages expose their metadata through setup.py, which imports
# PyTorch and probes CUDA. Supplying the pinned metadata lets uv resolve the
# optional extras without compiling them during an ordinary sync/lock.
[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.4.0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "mamba-ssm"
version = "2.2.4"
requires-dist = ["torch", "packaging", "ninja", "einops", "transformers"]
