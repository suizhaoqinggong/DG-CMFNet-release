[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dg-cmfnet"
version = "0.1.0"
description = "DG-CMFNet: Dual-granularity Cross-Modal Fusion Network for Brain Tumor Segmentation"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "tensorboard>=2.14",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "nibabel>=5.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
framework = "framework.cli.main:main"
tensorboard-compat = "framework.cli.tensorboard_compat:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 120
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

