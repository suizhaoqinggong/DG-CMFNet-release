[model]
name = "segformer3d"
num_classes = 4
num_modalities = 4

# SegFormer3D B0-style settings from the released BraTS configuration,
# adapted to framework-native 4-class logits for fair metric/loss handling.
sr_ratios = [4, 2, 1, 1]
embed_dims = [32, 64, 160, 256]
patch_kernel_size = [7, 3, 3, 3]
patch_stride = [4, 2, 2, 2]
patch_padding = [3, 1, 1, 1]
mlp_ratios = [4, 4, 4, 4]
num_heads = [1, 2, 5, 8]
depths = [2, 2, 2, 2]
decoder_head_embedding_dim = 256
decoder_dropout = 0.0
qkv_bias = true
attn_dropout = 0.0
proj_dropout = 0.0
mlp_dropout = 0.0

[task]
loss = "brats_region_dice"
