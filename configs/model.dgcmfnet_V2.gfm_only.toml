[model]
name = "dgcmfnet_V2"
num_classes = 4
num_modalities = 4
base_ch = 8
norm_affine = false
align_corners = true

# Ablation: keep only CG-GFM at the bottleneck.
fg_gim_stages = []
fg_gim_embed_dims = [32, 64, 128, 128, 256, 256]
fg_gim_num_heads = 4
fg_gim_pool_sizes = [
  [8, 8, 8],
  [8, 8, 8],
  [4, 4, 4],
  [4, 4, 4],
  [2, 2, 2],
  [2, 2, 2],
]
fg_gim_window_size = [3, 3, 3]

use_cg_gfm = true
cg_gfm_embed_dim = 256
cg_gfm_num_heads = 8
cg_gfm_num_layers = 2
cg_gfm_patch_size = [1, 1, 1]
cg_gfm_pos_grid_size = [4, 4, 4]

skip_fusion = "concat"
dropout = 0.0
unet_bottleneck_dropout = 0.2
decoder_type = "standard"
