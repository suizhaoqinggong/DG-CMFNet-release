[model]
name = "attention_unet"
num_classes = 4
num_modalities = 4

# 3D Attention U-Net baseline. It is intentionally framework-native: data,
# loss, metrics, checkpoints, and logging still come from DG-CMFNet.
base_ch = 16
channel_multipliers = [1, 2, 4, 8, 16]
norm = "instance_norm"
dropout = 0.0
attention_intermediate_ratio = 0.5

[task]
loss = "bce_focal"
loss_gamma = 0.0
