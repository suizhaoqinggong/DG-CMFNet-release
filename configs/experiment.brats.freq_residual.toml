[experiment]
name = "brats-segmentation-freq-residual"
seed = 37
threshold = 0.5
class_names = ["background", "NCR_NET", "ED", "ET"]

[data]
adapter = "brats"
root_dir = "data/brats2023"
batch_size = 4
num_workers = 4
pin_memory = true
persistent_workers = true
prefetch_factor = 2
val_ratio = 0.20
test_ratio = 0.0
crop_to_brain = false
normalize = true
use_preprocessed = true
preprocessed_dir = "data/brats2023"
augment_train = true
crop_size = [128, 128, 128]

[task]
name = "segmentation"
loss = "uahl"
loss_lambda_alpha = 1.0
loss_lambda_beta = 0.05
loss_gamma = 2.0

[optimizer]
name = "adam"
lr = 0.0005
weight_decay = 1e-5

[trainer]
epochs = 200
patience = 200
device = "cuda"
amp = false
grad_clip_norm = 1.0
lr_scheduler = true
lr_scheduler_factor = 0.5
lr_scheduler_patience = 10

[metrics.params.brats_dice]

[checkpoint]
monitor = "val_brats_dice_mean"
mode = "max"

[output]
root_dir = "runs"
