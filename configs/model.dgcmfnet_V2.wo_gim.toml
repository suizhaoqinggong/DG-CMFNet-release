[model]
name = "dgcmfnet_V2"
num_classes = 4
num_modalities = 4
base_ch = 8
norm_affine = false
align_corners = true

# Leave-one-out ablation: remove FG-GIM; retain CG-GFM and FDFM.
fg_gim_stages = []
use_cg_gfm = true
cg_gfm_embed_dim = 256
cg_gfm_num_heads = 8
cg_gfm_num_layers = 2
cg_gfm_patch_size = [1, 1, 1]
cg_gfm_pos_grid_size = [4, 4, 4]
skip_fusion = "concat"
dropout = 0.0
unet_bottleneck_dropout = 0.2
decoder_type = "frequency_guided"
decoder_frequency_position = "decoder_feature"
decoder_frequency_kernel_size = 3
decoder_frequency_stage_mapping = [[0, 3], [1, 4], [2, 5]]
decoder_frequency_gate_mode = "residual"
decoder_frequency_gate_init_bias = 0.0
