[experiment]
seed = 37
name = "brats2020-slicewise-2d-paper-unet"
threshold = 0.5
class_names = ["background", "NCR_NET", "ED", "ET"]

[data]
adapter = "brats_2d"
root_dir = "data/brats2020"
preprocessed_dir = "data/brats2020"
data_format = "npy"
use_preprocessed = true
batch_size = 1
num_workers = 4
pin_memory = true
persistent_workers = true
prefetch_factor = 2
train_ids_file = "configs/splits/brats2020_fold0_train_ids.txt"
val_ids_file = "configs/splits/brats2020_fold0_val_ids.txt"
test_ids_file = "configs/splits/brats2020_fold0_holdout_ids.txt"
augment_train = true
crop_size = [128, 128, 128]
slices_per_case = 4
foreground_slice_ratio = 0.5
cache_in_memory = false
seed = 37

[task]
name = "segmentation"

[optimizer]
name = "adam"
lr = 0.0005
weight_decay = 1e-5

[trainer]
epochs = 200
patience = 200
device = "cuda"
amp = true
grad_clip_norm = 1.0
lr_scheduler = true
lr_scheduler_factor = 0.5
lr_scheduler_patience = 10

[metrics.params.brats_dice]

[checkpoint]
monitor = "val_brats_dice_mean"
mode = "max"

[output]
root_dir = "runs"
