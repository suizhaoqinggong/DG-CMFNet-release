[model]
name = "swinbts"
num_classes = 4
num_modalities = 4

# Jiang et al. (2022): non-overlapping 4^3 patches, three stride-two
# convolutional downsamplings, NFCE, and a two-block ETrans bottleneck.
img_size = [128, 128, 128]
strict_img_size = true
embed_dim = 96
depths = [2, 2, 2, 2]
num_heads = [3, 6, 12, 24]
window_size = 7
mlp_ratio = 4.0
drop_rate = 0.0
attn_drop_rate = 0.0
drop_path_rate = 0.2
etrans_depth = 2
out_channels = 3

[task]
# The three direct outputs are ordered TC, WT, ET for the framework's BraTS
# region postprocessor; this is the paper's Dice + CE objective.
loss = "swinbts_dice_ce"
