[model]
name = "dgcmfnet_V2"
num_classes = 4
num_modalities = 4
base_ch = 8
norm_affine = false
align_corners = true

# Ablation: keep only FG-GIM on stages 3 and 4; leave other skips and bottleneck untouched.
# Pool sizes follow the selected feature hierarchy and C' = 2 * C_l.
fg_gim_stages = [ 2, 3, 4]
fg_gim_embed_dims = [ 64, 128, 256]
fg_gim_num_heads = 4
fg_gim_pool_sizes = [
  [8, 8, 8],
  [8, 8, 8],
  [8, 8, 8],
]
fg_gim_window_size = [3, 3, 3]
fg_gim_auxiliary_skip = true
fg_gim_modality_aware = true
fg_gim_relation_bias = true
fg_gim_edge_mode = "all"

use_cg_gfm = false
skip_fusion = "concat"
dropout = 0.0
unet_bottleneck_dropout = 0.2
decoder_type = "standard"
